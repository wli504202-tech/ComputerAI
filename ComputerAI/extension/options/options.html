<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>Computer.AI Settings</title><style>body{max-width:680px;margin:35px auto;font:15px/1.5 system-ui}label{display:block;margin:15px 0 5px;font-weight:700}input,select{width:100%;box-sizing:border-box;padding:9px}button{margin-top:20px;padding:10px 16px;background:#6d28d9;color:white;border:0;border-radius:8px;font-weight:700}.note{color:#555}</style></head><body><h1>Computer.AI Settings</h1><p class="note">伺服器僅限 localhost。工作區外的檔案一律不會被存取。</p><label>Server URL</label><input id="serverUrl"><label>Workspace</label><input id="workspace" placeholder="Start the server to read or change this"><label><input type="checkbox" id="confirmation" style="width:auto"> Require confirmation for high-risk operations</label><label><input type="checkbox" id="python" style="width:auto"> Allow Python</label><label><input type="checkbox" id="node" style="width:auto"> Allow Node</label><label><input type="checkbox" id="shell" style="width:auto"> Allow restricted shell commands</label><label>Maximum command time (seconds)</label><input id="timeout" type="number" min="1" max="60"><button id="save">Save settings</button><p id="result"></p><script src="options.js"></script></body></html>
